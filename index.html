:before { right: 0; margin-right: -12px; border-left-color: #fff; } .leaflet-tooltip-right:before { left: 0; margin-left: -12px; border-right-color: #fff; } @media print { .leaflet-control { -webkit-print-color-adjust: exact; print-color-adjust: exact; } } 
:root{
  --paper:#F3F7FA;--surface:#FFFFFF;--ink:#1E3354;--ink2:#56677F;--ink3:#8796AA;--line:#D9E3EC;
  --leaf:#2F8F6B;--leafS:#E1F2EA;--sun:#C98A06;--sunS:#FDF2D3;--coral:#C9433A;--coralS:#FBE5E2;
  --sky:#3570C9;--skyS:#E4EDFA;--hero:#1E3354;--hero2:#253F63;--onleaf:#FFFFFF;--map:#E9F0F6;--seoul:#DCE8F8;--incheon:#E1F2EA;--gg:#FFFFFF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1722;--surface:#172231;--ink:#E7EEF5;--ink2:#AEBBCB;--ink3:#7D8DA1;--line:#283648;
  --leaf:#5CC495;--leafS:#17332A;--sun:#F2C14E;--sunS:#3A3020;--coral:#F07A70;--coralS:#3B2220;
  --sky:#7EAAF0;--skyS:#1A2A44;--hero:#16263D;--hero2:#1E3352;--onleaf:#0F1722;--map:#121C29;--seoul:#1E2E47;--incheon:#173229;--gg:#1A2534;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1722;--surface:#172231;--ink:#E7EEF5;--ink2:#AEBBCB;--ink3:#7D8DA1;--line:#283648;
  --leaf:#5CC495;--leafS:#17332A;--sun:#F2C14E;--sunS:#3A3020;--coral:#F07A70;--coralS:#3B2220;
  --sky:#7EAAF0;--skyS:#1A2A44;--hero:#16263D;--hero2:#1E3352;--onleaf:#0F1722;--map:#121C29;--seoul:#1E2E47;--incheon:#173229;--gg:#1A2534;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero)}
h1,h2,h3{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-weight:400;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:#F3F7FA}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.date{flex:1;min-width:0}
.date b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date span{font-size:12.5px;opacity:.75}
.wx{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:999px;padding:5px 12px 5px 8px;border:0;cursor:pointer;color:inherit}
.wx .ic{font-size:20px;line-height:1}
.wx .t{font-weight:700;font-size:17px}
.wx small{font-size:11.5px;opacity:.8;display:block;line-height:1.2}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.wxdrop{background:var(--hero2);color:#F3F7FA;display:none}
.wxdrop.open{display:block}
.wxdrop .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:12px}
.wxd{flex:0 0 auto;text-align:center;font-size:12.5px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.08);min-width:64px}
.wxd b{display:block;font-size:18px;margin:2px 0}
.wxnote{font-size:11.5px;opacity:.7;padding:0 0 10px}

/* hero */
.hero{background:var(--hero);color:#F3F7FA;padding:4px 0 26px;border-radius:0 0 28px 28px;margin-bottom:18px}
#heroMain{display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:stretch}
.kids{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.kids::-webkit-scrollbar{display:none}
.kid{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.28);background:transparent;color:#F3F7FA;border-radius:999px;padding:3px 14px 3px 3px;cursor:pointer;min-height:42px;font-size:14px}
.kid .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:rgba(255,255,255,.12)}
.kid.on{background:#F3F7FA;color:#1E3354;border-color:#F3F7FA;font-weight:700}
.kid.on .av{background:#F2C14E}
.kid.add{padding:3px 14px;border-style:dashed;opacity:.9}
.avbig{font-size:30px;line-height:1}
.dots{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:11.5px;opacity:.85}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.35)}
.dots i.on{background:#F2C14E;width:20px}
.dots span{margin-left:6px}
.slide-l{animation:slideL .28s ease}.slide-r{animation:slideR .28s ease}
@keyframes slideL{from{opacity:.25;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.25;transform:translateX(-36px)}to{opacity:1;transform:none}}
.btn.danger{color:var(--coral);border-color:var(--coralS)}
.bigemo{float:right;font-size:46px;line-height:1;margin:-4px 0 0 10px}
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:12px}
.timeline div{text-align:center;padding:8px 2px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;color:var(--ink2);line-height:1.3}
.timeline b{display:block;font-size:22px;font-weight:400;margin-bottom:2px}
.timeline small{display:block;font-size:10px;color:var(--ink3)}
.timeline div.on{background:var(--sunS);border-color:var(--sun);color:var(--ink);font-weight:700}
.mix{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mix div{text-align:center;border-radius:12px;background:var(--paper);padding:8px 2px;font-size:12px;color:var(--ink2)}
.mix b{display:block;font-size:22px;font-weight:400}
.mix small{display:block;color:var(--ink3);font-size:11px}
.mix div.off{opacity:.4}
.dtag{display:inline-block;font-size:11.5px;border-radius:6px;padding:0 6px;margin-right:4px;background:var(--paper);color:var(--ink2);border:1px solid var(--line)}
ul.emol{list-style:none;padding:0;margin:6px 0 0}
ul.emol li{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:14.5px}
ul.emol li>span:first-child{font-size:20px;flex:0 0 26px;text-align:center}
.ring{display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.ring b{display:block;font-size:14.5px;font-weight:500}
.ring .muted{font-size:13px;letter-spacing:1px;word-break:break-all}
.fitem i{display:block;font-style:normal;font-size:32px;line-height:1.15;position:relative;width:max-content}
.fitem i em{position:absolute;right:-12px;bottom:-4px;font-size:15px;font-style:normal}
.fitem.bad{background:var(--coralS)}.fitem.warn{background:var(--sunS)}
.lv h4 .le{display:block;font-style:normal;font-size:26px;line-height:1.2}
.plate{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dish{width:160px;height:160px;border-radius:50%;background:var(--surface);border:10px solid var(--line);box-shadow:inset 0 0 0 2px var(--paper);position:relative;flex:0 0 auto}
.dish span{position:absolute;transform:translate(-50%,-50%);font-size:34px;line-height:1}
.plate ul.emol{flex:1;min-width:160px}
.plate ul.emol b{font-weight:500;color:var(--ink2);font-size:13px}
.mkw{background:transparent;border:0}
.mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.place{grid-template-columns:34px 1fr auto!important}
.place .ce{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.herobtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.herobtns .editbtn{margin-top:0}
.editbtn.sun{background:#F2C14E;color:#1E3354;border-color:#F2C14E;font-weight:700}
textarea{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;width:100%;font:inherit;color:inherit;resize:vertical}
/* stars & links */
.st{color:#E9A100;letter-spacing:1px;font-size:15px}
.place .rate{margin:2px 0;color:var(--ink)}
.place .rate b{font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lkbtn{display:inline-flex;align-items:center;gap:4px;font-size:13px;text-decoration:none;border:1px solid var(--line);background:var(--paper);color:var(--sky);border-radius:999px;padding:6px 12px;min-height:34px}
.me{width:22px;height:22px;border-radius:50%;background:#3570C9;border:4px solid #fff;box-shadow:0 0 0 6px rgba(53,112,201,.25),0 1px 4px rgba(0,0,0,.4)}
#cityPick{min-height:44px}
/* calendar */
.cal .calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal .calh h3{margin:0;text-align:center;flex:1;font-size:17px}
.cal .calh h3 small{display:block;margin:0}
.iconlite{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:22px;cursor:pointer;line-height:1}
.iconlite:disabled{opacity:.35}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:12px;color:var(--ink3);padding:2px 0}
.cw.sun{color:var(--coral)}
.cd{position:relative;aspect-ratio:1/1.08;border:1px solid transparent;border-radius:12px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 0 0;cursor:pointer;color:var(--ink);min-width:0;font:inherit}
.cd.empty{background:transparent;cursor:default}
.cd:disabled{opacity:.35;cursor:default}
.cd .dn{font-size:11.5px;line-height:1.2;color:var(--ink2)}
.cd.has{background:var(--sunS)}
.cd.today{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.cd.today .dn{color:var(--leaf);font-weight:700}
.stk{display:inline-block;font-size:clamp(20px,6.4vw,30px);line-height:1;transform:rotate(var(--r,0deg));filter:drop-shadow(0 0 0 #fff) drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff) drop-shadow(0 2px 2px rgba(0,0,0,.18));margin-top:2px}
.stk.big{font-size:44px}
.mdot,.ann{position:absolute;right:2px;bottom:2px;font-style:normal;font-size:10px}
.ann{opacity:.7}
.todaycard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;cursor:pointer;background:linear-gradient(135deg,var(--sunS),var(--leafS));color:var(--ink);border-radius:20px;padding:14px 16px;margin-bottom:14px;font:inherit}
.todaycard b{display:block;font-family:"Gowun Dodum",sans-serif;font-size:18px;font-weight:400}
.todaycard small{display:block;font-size:13px;color:var(--ink2);line-height:1.5}
/* day popup */
.pop{position:fixed;inset:0;z-index:50;background:rgba(10,18,30,.55);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
.pop.open{display:flex}
.dcard{background:var(--surface);color:var(--ink);border-radius:28px;width:min(440px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:popIn .22s ease}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.dcard{animation:none}}
.dc-top{position:relative;text-align:center;padding:22px 16px 18px;border-radius:28px 28px 0 0;color:#1E3354}
.dc-x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.7);color:#1E3354;font-size:16px;cursor:pointer}
.dc-stk{font-size:84px;line-height:1;width:128px;height:128px;margin:0 auto 8px;border-radius:50%;background:#fff;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 4px 0 rgba(0,0,0,.06)}
.dc-date{font-size:13px;opacity:.75}
.dc-top h2{font-size:24px;margin:2px 0}
.dc-sub{font-size:13px;opacity:.8}
.dc-body{padding:16px 18px 18px}
.dc-line{font-size:15px;background:var(--paper);border-radius:16px;padding:12px 14px;margin:0 0 12px}
.dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dc-tile{background:var(--paper);border-radius:16px;padding:10px 12px;position:relative;min-width:0}
.dc-tile .te{font-size:26px;line-height:1;display:block;margin-bottom:4px}
.dc-tile b{display:block;font-size:16px;font-weight:700}
.dc-tile small{display:block;font-size:12.5px;color:var(--ink2);line-height:1.45}
.mbar{position:relative;height:6px;border-radius:3px;margin-top:6px;background:linear-gradient(90deg,var(--coralS) 0 3%,var(--sunS) 3% 15%,var(--leafS) 15% 85%,var(--sunS) 85% 97%,var(--coralS) 97%)}
.mbar i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.stkpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.stkpick button{font-size:24px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.stkpick button.on{border-color:var(--leaf);background:var(--leafS);box-shadow:inset 0 0 0 1px var(--leaf)}
.bfchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ro .edit-only{display:none!important}
#aiRow{display:none!important}
.owner-only{display:none!important}
.is-owner:not(.ro) .owner-only{display:inline-flex!important}
.is-owner:not(.ro) #exFam.owner-only{display:block!important}
.fambanner{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:var(--leafS);border-radius:16px;padding:12px 16px;margin:0 0 14px;font-size:13.5px}
.fambanner[hidden]{display:none}
.fambanner b{font-family:"Gowun Dodum",sans-serif;font-weight:400;font-size:17px}
.fambanner span{color:var(--ink2)}
.famkid{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--paper);font-size:15px;cursor:pointer}
.famkid input{width:22px;height:22px;accent-color:var(--leaf)}
.famstat{border-radius:14px;padding:12px 14px;font-size:14px}
.famstat.ok{background:var(--leafS)}.famstat.stale{background:var(--sunS)}.famstat.none{background:var(--paper)}
ol.steps{padding-left:20px;margin:6px 0;font-size:14px}
ol.steps li{margin:4px 0}
.tabs a{font-size:11px}
.tabs a svg{width:22px;height:22px}
/* luck */
.luck{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.lk-tile{border-radius:20px;padding:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.lk-tile p{margin:4px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.lk-h{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.lk-h small{font-size:11px}
.lk-tile b{display:block;font-family:"Gowun Dodum",sans-serif;font-weight:400;font-size:18px;line-height:1.35;color:var(--ink)}
.lk-st{color:#E9A100!important;letter-spacing:2px;font-family:inherit!important}
.lk-sub{font-size:12.5px!important;color:var(--ink3)!important}
.lk-src{font-size:12px!important;color:var(--ink3)!important}
.fortune{background:linear-gradient(160deg,var(--skyS),var(--surface))}
.color{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--surface)),var(--surface))}
.color .sw{display:block;width:44px;height:44px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--surface),0 2px 6px rgba(0,0,0,.15);margin:2px 0 8px}
.quote{background:linear-gradient(160deg,var(--sunS),var(--surface))}
.sweet{background:linear-gradient(160deg,var(--coralS),var(--surface))}
@media (max-width:360px){.luck{grid-template-columns:1fr}}
/* edu */
.kidsch{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.kidsch:first-of-type{border-top:0}
.kidsch .av{font-size:30px}
.kidsch p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
details.sch{border-top:1px solid var(--line)}
details.sch:first-child{border-top:0}
details.sch summary{list-style:none;display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:12px 0;cursor:pointer;min-height:56px}
details.sch summary::-webkit-details-marker{display:none}
details.sch summary::after{content:"⌄";grid-column:3;justify-self:end;color:var(--ink3);font-size:16px;margin-top:-28px}
details.sch[open] summary::after{content:"⌃"}
.rk{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--paper);font-weight:700;font-size:14px;color:var(--ink2)}
.rk.top{background:var(--sunS);color:var(--sun)}
.sn b{display:block;font-size:15px;font-weight:500}
.sn small{display:block;font-size:12px;color:var(--ink3)}
.sm{text-align:right;padding-right:18px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:2px 0 8px}
.sgrid div{background:var(--paper);border-radius:12px;padding:8px 10px;min-width:0}
.sgrid div.wide{grid-column:1/-1}
.sgrid span{display:block;font-size:11.5px;color:var(--ink3)}
.sgrid b{display:block;font-size:14px;font-weight:500}
.sgrid .gbar{height:8px;border-radius:4px;background:#F2A7C3;margin-top:6px;overflow:hidden;padding:0}
.sgrid .gbar i{display:block;height:100%;background:#7FB3F5}
details.sch .links{padding-bottom:12px}
.bfchips span{background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.who h1{font-size:22px}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.14)}
.badge.m{background:#3B6FB8}.badge.f{background:#B8527A}
.agebig{font-family:"Gowun Dodum",sans-serif;font-size:clamp(44px,13vw,68px);line-height:1;margin:6px 0 4px;letter-spacing:-.02em}
.agebig small{font-size:.38em;margin-left:4px;opacity:.85}
.agesub{font-size:15px;opacity:.88}
.herofacts{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.herofacts div{font-size:12.5px;opacity:.8}
.herofacts b{display:block;font-size:17px;opacity:1;font-weight:500;color:#fff}
.editbtn{margin-top:14px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.ruler{position:relative;border-radius:14px;background:linear-gradient(90deg,#F2C14E 0,#F2C14E 100%);overflow:hidden;min-height:200px}
.ruler svg{position:absolute;inset:0;width:100%;height:100%}

/* views */
.view{display:none}
.view.on{display:block}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 4px}
.vh h2{font-size:25px}
.vh .meta{font-size:12.5px;color:var(--ink3)}
.lede{color:var(--ink2);margin:2px 0 16px;font-size:14.5px}
.block{background:var(--surface);border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.block h3{font-size:18px;margin-bottom:10px}
.block h3 small{font-family:"Noto Sans KR",sans-serif;font-size:12.5px;color:var(--ink3);margin-left:6px}
.flat{padding:4px 2px 16px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.flat h3{font-size:18px;margin:6px 0 10px}
.muted{color:var(--ink3);font-size:13px}
.note{font-size:12.5px;color:var(--ink3);margin-top:10px;line-height:1.55}
.callout{border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:14.5px}
.callout.sun{background:var(--sunS)}
.callout.leaf{background:var(--leafS)}
.callout.coral{background:var(--coralS)}
.callout.sky{background:var(--skyS)}
.callout b{display:block;margin-bottom:2px}
.empty{text-align:center;padding:28px 10px;color:var(--ink2)}
.empty button{margin-top:12px}

.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--ink);color:var(--paper);font-weight:500;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.leaf{background:var(--leaf);color:var(--onleaf)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);flex:1;min-width:110px}
input[type=text],input[type=number],input[type=date],input[type=email],select{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;cursor:pointer;color:var(--ink2);min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;min-height:36px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .cd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:500;white-space:nowrap}
.tag.leaf{background:var(--leafS);color:var(--leaf)}
.tag.sun{background:var(--sunS);color:var(--sun)}
.tag.coral{background:var(--coralS);color:var(--coral)}
.tag.sky{background:var(--skyS);color:var(--sky)}
.tag.gray{background:var(--paper);color:var(--ink3);border:1px solid var(--line)}

/* growth */
.meter{padding:14px 0;border-top:1px solid var(--line)}
.meter:first-child{border-top:0;padding-top:4px}
.meter .top1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter .lab{font-size:13px;color:var(--ink2)}
.meter .val{font-family:"Gowun Dodum",sans-serif;font-size:28px;line-height:1.1}
.meter .val small{font-size:14px;color:var(--ink2);margin-left:2px}
.meter .pct{text-align:right}
.meter .pct b{font-size:20px;font-weight:700}
.bar{position:relative;height:12px;border-radius:999px;margin:10px 0 6px;background:linear-gradient(90deg,var(--coralS) 0 3%,var(--sunS) 3% 15%,var(--leafS) 15% 85%,var(--sunS) 85% 97%,var(--coralS) 97% 100%)}
.bar i{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.bar em{position:absolute;top:0;bottom:0;width:2px;background:var(--ink3);opacity:.5;left:50%}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.cmp{font-size:13.5px;color:var(--ink2);margin-top:4px}
.chartbox svg{width:100%;height:auto;display:block}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-weight:500;color:var(--ink2);font-size:12.5px}
.tw{overflow-x:auto}
.del{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:13px;min-height:32px}

/* play */
.now{background:var(--hero);color:#F3F7FA;border-radius:22px;padding:18px;margin-bottom:14px}
.now .slot{font-size:12.5px;opacity:.75}
.now h3{font-size:22px;margin:4px 0 8px}
.now p{margin:0;opacity:.9;font-size:14.5px}
.now .dom{display:inline-block;margin-top:10px;font-size:12px;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.14)}
.act{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0}
.act .d{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;line-height:1}
.act h4{margin:0 0 2px;font-size:15.5px;font-weight:500}
.act p{margin:0;font-size:14px;color:var(--ink2)}
.d.신체{background:var(--leafS);color:var(--leaf)}.d.언어{background:var(--skyS);color:var(--sky)}
.d.인지{background:var(--sunS);color:var(--sun)}.d.정서{background:var(--coralS);color:var(--coral)}.d.감각{background:var(--paper);color:var(--ink2);border:1px solid var(--line)}
ul.ck{list-style:none;padding:0;margin:0}
ul.ck li{padding:8px 0 8px 28px;position:relative;border-bottom:1px dashed var(--line);font-size:14.5px}
ul.ck li:last-child{border-bottom:0}
ul.ck li::before{content:"";position:absolute;left:4px;top:14px;width:12px;height:12px;border-radius:4px;border:2px solid var(--leaf)}
ul.dot{padding-left:18px;margin:6px 0}
ul.dot li{margin:4px 0;font-size:14.5px}

/* health */
.vx{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.vx:first-child{border-top:0}
.vx input{width:22px;height:22px;accent-color:var(--leaf)}
.vx .n{font-size:14.5px}
.vx .n small{display:block;color:var(--ink3);font-size:12.5px}
.q{margin:12px 0}
.q .ql{font-size:13.5px;font-weight:500;margin-bottom:6px}
.result{border-radius:18px;padding:16px;margin-top:14px;border:2px solid var(--line)}
.result.coral{border-color:var(--coral);background:var(--coralS)}
.result.sun{border-color:var(--sun);background:var(--sunS)}
.result.leaf{border-color:var(--leaf);background:var(--leafS)}
.result h4{margin:0 0 6px;font-family:"Gowun Dodum",sans-serif;font-weight:400;font-size:20px}
.ai{white-space:pre-wrap;font-size:14.5px;margin-top:10px;background:var(--paper);border-radius:14px;padding:12px;display:none}

/* food */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fitem{border-radius:14px;padding:10px 12px;background:var(--paper)}
.fitem b{display:block;font-size:15px}
.fitem span{font-size:12.5px;color:var(--ink2)}
.lv{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.lv:first-child{border-top:0}
.lv h4{margin:0;font-size:15px;font-weight:500}
.lv p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}

/* map */
#mapEl{height:min(56vh,420px);border-radius:20px;border:1px solid var(--line);background:var(--map);margin-bottom:12px;z-index:1}
.leaflet-container{background:var(--map);font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px;font-size:13.5px;line-height:1.5}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.lbl{background:transparent;border:0;box-shadow:none;color:var(--ink2);font-size:11px;font-weight:500;padding:0}
.lbl::before{display:none}
.lbl.big{font-family:"Gowun Dodum",sans-serif;font-size:16px;color:var(--ink)}
.place{display:grid;grid-template-columns:12px 1fr auto;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.place .c{width:12px;height:12px;border-radius:50%;margin-top:6px}
.place h4{margin:0;font-size:15.5px;font-weight:500}
.place p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.place .deal{color:var(--coral);font-weight:500}
.place .km{font-size:13px;color:var(--ink3);text-align:right;white-space:nowrap}
.place .lk{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:13px}
.place .lk a{white-space:nowrap}

/* benefits */
.bf{padding:14px 0;border-top:1px solid var(--line)}
.bf:first-child{border-top:0}
.bf .h{display:flex;justify-content:space-between;gap:10px;align-items:start}
.bf h4{margin:0;font-size:15.5px;font-weight:500}
.bf .amt{font-family:"Gowun Dodum",sans-serif;font-size:19px;color:var(--leaf);margin:2px 0}
.bf p{margin:2px 0;font-size:13.5px;color:var(--ink2)}
.grp{font-family:"Gowun Dodum",sans-serif;font-size:19px;margin:20px 0 6px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(7,1fr);padding:0 2px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;color:var(--ink3);font-size:11.5px;min-height:58px}
.tabs a svg{width:23px;height:23px}
.tabs a.on{color:var(--ink);font-weight:700}
.tabs a.on svg{color:var(--leaf)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:40;display:none}
.scrim.open{display:block}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease,visibility 0s linear .25s;padding:8px 0 calc(20px + env(safe-area-inset-bottom,0px))}

.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:22px;margin-bottom:4px}
.sheet .wrap>*+*{margin-top:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sync{font-size:11.5px;opacity:.7}

@media (max-width:360px){.timeline small{display:none}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

<div class="sheet" id="profileSheet" role="dialog" aria-modal="true" aria-labelledby="pfTitle">
  <div class="grab"></div>
  <div class="wrap">
    <h2 id="pfTitle">아이 정보</h2>
    <p class="muted" style="margin:0">입력한 정보는 이 아이 분석에만 쓰이고, 내 계정에만 저장돼요.</p>
    <label class="f">이름 또는 태명<input type="text" id="pfName" maxlength="20" placeholder="예: 하율"></label>
    <div class="q"><div class="ql">성별</div><div class="seg" id="pfSex"><button type="button" data-s="m">남아</button><button type="button" data-s="f">여아</button></div></div>
    <label class="f">생년월일<input type="date" id="pfBirth"></label>
    <div class="q"><div class="ql">출생 순위 <span class="muted">(지원금 계산에 써요)</span></div><div class="seg" id="pfOrder"><button type="button" data-o="1">첫째</button><button type="button" data-o="2">둘째</button><button type="button" data-o="3">셋째 이상</button></div></div>
    <div class="q"><div class="ql">어린이집·유치원</div><div class="seg" id="pfCare"><button type="button" data-c="home">가정 양육</button><button type="button" data-c="center">다니는 중</button></div></div>
    <label class="f">리포트 받을 이메일 <span class="muted">(선택)</span><input type="email" id="pfEmail" placeholder="name@example.com"></label>
    <div class="row"><button class="btn leaf" id="pfSave" style="flex:1">저장하고 분석하기</button><button class="btn ghost" id="pfCancel">닫기</button></div>
    <button class="btn ghost danger" id="pfDel" hidden style="width:100%">이 아이 삭제</button>
    <p class="note" id="pfErr" role="alert"></p>
  </div>
</div>

<div class="sheet" id="exportSheet" role="dialog" aria-modal="true" aria-labelledby="exTitle">
  <div class="grab"></div>
  <div class="wrap">
    <h2 id="exTitle">분석 내용 받기</h2>

    <button class="btn leaf" id="exXlsx" style="width:100%">엑셀 파일로 저장</button>
    <button class="btn" id="exMail" style="width:100%">이메일로 보내기</button>
    <button class="btn ghost owner-only" id="exFam" style="width:100%">👨‍👩‍👧 가족 공유 링크 만들기</button>

    <p class="note" id="exMsg" role="status"></p>
  </div>
</div>

function ageInfo(){
  if(!K.child||!K.child.birth)return null;
  const b=new Date(K.child.birth+"T00:00:00"),now=new Date();
  const days=Math.floor((now-b)/86400000); if(days<0)return null;
  let months=(now.getFullYear()-b.getFullYear())*12+(now.getMonth()-b.getMonth());
  if(now.getDate()<b.getDate())months--;
  const anc=new Date(b);anc.setMonth(b.getMonth()+months);
  const rem=Math.max(0,Math.floor((now-anc)/86400000));
  return{days,months,rem,mf:days/30.4375,years:Math.floor(months/12)};
}
function ageLabel(a){if(!a)return"";return a.months<24?`${a.months}개월 ${a.rem}일`:`만 ${a.years}세 ${a.months%12}개월`;}
function stageOf(list,m){return list.find(s=>m>=s.from&&m<s.to)||list[list.length-1];}

/* ================= 성장 계산 (WHO/CDC LMS) ================= */
function lmsAt(sex,ind,m){const t=LMS[sex==="m"?"b":"g"][ind];m=Math.max(0,Math.min(144,m));const i=Math.floor(m),f=m-i;const a=t[i],b=t[Math.min(144,i+1)];return a.map((v,k)=>v+(b[k]-v)*f);}
function zOf(x,[L,M,Sg]){return Math.abs(L)<1e-6?Math.log(x/M)/Sg:(Math.pow(x/M,L)-1)/(L*Sg);}
function xOf(z,[L,M,Sg]){return Math.abs(L)<1e-6?M*Math.exp(Sg*z):M*Math.pow(1+L*Sg*z,1/L);}
function ncdf(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}
function gradeOf(p,kind){
  if(kind==="bmi"){if(p<5)return["저체중","coral"];if(p<85)return["정상 범위","leaf"];if(p<95)return["과체중 위험","sun"];return["비만 범위","coral"];}
  const w=kind==="w";
  if(p<3)return[w?"매우 가벼움":"매우 작음","coral"];if(p<15)return[w?"가벼운 편":"작은 편","sun"];if(p<=85)return["평균 범위","leaf"];if(p<=97)return[w?"무거운 편":"큰 편","sun"];return[w?"매우 무거움":"매우 큼","coral"];
}
function monthsAt(dateStr){const b=new Date(K.child.birth+"T00:00:00"),d=new Date(dateStr+"T00:00:00");return(d-b)/86400000/30.4375;}
function latest(){const ms=(K.measures||[]).slice().sort((a,b)=>a.d<b.d?1:-1);return ms[0]||null;}
function analyzeGrowth(){
  const a=ageInfo();if(!a)return null;const sex=K.child.sex;const m=latest();
  const out={age:a.mf,medH:lmsAt(sex,"lhfa",a.mf)[1],medW:lmsAt(sex,"wfa",a.mf)[1],m};
  if(m){const mm=monthsAt(m.d);out.mm=mm;
    if(m.h){const l=lmsAt(sex,"lhfa",mm);out.h={v:m.h,z:zOf(m.h,l),med:l[1]};out.h.p=ncdf(out.h.z)*100;}
    if(m.w){const l=lmsAt(sex,"wfa",mm);out.w={v:m.w,z:zOf(m.w,l),med:l[1]};out.w.p=ncdf(out.w.z)*100;}
    if(m.h&&m.w){const bmi=m.w/Math.pow(m.h/100,2);const l=lmsAt(sex,"bmifa",mm);out.b={v:bmi,z:zOf(bmi,l),med:l[1]};out.b.p=ncdf(out.b.z)*100;}
  }
  return out;
}

function drawRuler(g){
  const svg=$("#rulerSvg");const W=100,H=300;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  let top=g?Math.max(g.medH,g.h?g.h.v:0)+8:100;top=Math.ceil(top/10)*10;const bot=Math.max(0,top-(top>60?50:40));
  const y=v=>H-((v-bot)/(top-bot))*H;
  let s="";
  for(let v=bot;v<=top;v++){const yy=y(v);const big=v%10===0,mid=v%5===0;const len=big?34:(mid?24:14);
    s+=`<line x1="0" x2="${len}" y1="${yy}" y2="${yy}" stroke="#1E3354" stroke-width="${big?1.6:0.9}" vector-effect="non-scaling-stroke"/>`;
    if(big&&v>bot&&v<top)s+=`<text x="40" y="${yy+4}" font-size="13" fill="#1E3354" font-family="Noto Sans KR" font-weight="700">${v}</text>`;}
  if(g){
    const ym=y(g.medH);s+=`<line x1="0" x2="${W}" y1="${ym}" y2="${ym}" stroke="#1E3354" stroke-dasharray="4 3" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="${W-4}" y="${ym-5}" text-anchor="end" font-size="11" fill="#1E3354" font-family="Noto Sans KR">평균</text>`;
    if(g.h){const yk=y(g.h.v);s+=`<rect x="0" y="${yk-1.5}" width="${W}" height="3" fill="#C9433A"/><text x="${W-4}" y="${yk+15}" text-anchor="end" font-size="12" fill="#C9433A" font-weight="700" font-family="Noto Sans KR">${g.h.v}</text>`;}
  }
  svg.innerHTML=s;
}

function monthLabel(mm){const m=Math.floor(mm);return m<24?`${m}개월`:`만 ${Math.floor(m/12)}세 ${m%12}개월`;}
function meter(label,o,unit,kind){
  const [gr,tone]=gradeOf(o.p,kind);const pos=Math.max(0.5,Math.min(99.5,o.p));
  const diff=o.v-o.med;const val=kind==="bmi"?o.v.toFixed(1):o.v;
  const rank=Math.max(1,Math.round(100-o.p));
  const cmp=kind==="bmi"?`또래 중앙값 ${o.med.toFixed(1)}`:`또래 평균(중앙값) ${o.med.toFixed(1)}${unit} · ${diff>=0?"+":""}${diff.toFixed(1)}${unit} · 100명 중 ${kind==="w"?"무거운":"큰"} 순서로 약 ${rank}번째`;
  return`<div class="meter"><div class="top1"><div><div class="lab">${label}</div><div class="val">${val}<small>${unit}</small></div></div><div class="pct"><div class="lab">백분위</div><b>${fmtP(o.p)}</b><span class="lab">%</span><br><span class="tag ${tone}">${gr}</span></div></div>
  <div class="bar" role="img" aria-label="${label} 백분위 ${fmtP(o.p)}"><em></em><i style="left:${pos}%"></i></div><div class="scale"><span>3</span><span>15</span><span>50</span><span>85</span><span>97</span></div><div class="cmp">${cmp}</div></div>`;
}
function summaryTone(g){const ps=[g.h,g.w].filter(Boolean).map(o=>o.p);if(ps.some(p=>p<3||p>97))return"coral";if(ps.some(p=>p<15||p>85))return"sun";return"leaf";}
function growthSummary(g){
  const s=[];const name=K.child.name||"아이";
  if(g.h)s.push(`키는 또래 100명 중 작은 순서로 약 ${fmtP(g.h.p)}번째(${gradeOf(g.h.p,"h")[0]})`);
  if(g.w)s.push(`몸무게는 가벼운 순서로 약 ${fmtP(g.w.p)}번째(${gradeOf(g.w.p,"w")[0]})`);
  let t=`${name}의 ${s.join(", ")}예요.`;
  if(g.h&&g.w){const gap=Math.abs(g.h.p-g.w.p);if(gap>40)t+=` 키와 몸무게 백분위 차이가 커서 체형(BMI)도 함께 살펴보세요.`;else t+=` 키와 몸무게가 비슷한 비율로 자라고 있어요.`;}
  const prev=(K.measures||[]).filter(m=>m.h).sort((a,b)=>a.d<b.d?-1:1);
  if(prev.length>=2){const a=prev[prev.length-2],b=prev[prev.length-1];const pa=ncdf(zOf(a.h,lmsAt(K.child.sex,"lhfa",monthsAt(a.d))))*100,pb=ncdf(zOf(b.h,lmsAt(K.child.sex,"lhfa",monthsAt(b.d))))*100;const dd=pb-pa;
    t+=Math.abs(dd)<10?` 지난 기록과 비교해 키 백분위가 안정적이에요.`:(dd>0?` 지난 기록보다 키 백분위가 ${Math.round(dd)}만큼 올랐어요.`:` 지난 기록보다 키 백분위가 ${Math.round(-dd)}만큼 내려갔어요. 측정 오차를 확인하고 계속 내려가면 상담하세요.`);}
  return t;
}
function growthChart(ind){
  const a=ageInfo();const sex=K.child.sex;
  const ms=(K.measures||[]).filter(m=>ind==="lhfa"?m.h:m.w).map(m=>({x:monthsAt(m.d),y:ind==="lhfa"?m.h:m.w}));
  let x0=Math.max(0,Math.floor(a.mf-12)),x1=Math.min(144,Math.ceil(a.mf+6));
  ms.forEach(p=>{x0=Math.min(x0,Math.floor(p.x));});x0=Math.max(0,x0);if(x1-x0<6)x1=x0+6;
  const Z=[-1.881,-1.036,0,1.036,1.881];const lines=Z.map(z=>{const pts=[];for(let x=x0;x<=x1;x+=(x1-x0)/40)pts.push([x,xOf(z,lmsAt(sex,ind,x))]);return pts;});
  let y0=Math.min(...lines[0].map(p=>p[1]),...ms.map(p=>p.y)),y1=Math.max(...lines[4].map(p=>p[1]),...ms.map(p=>p.y));
  const pd=(y1-y0)*0.06;y0-=pd;y1+=pd;
  const W=340,H=220,L=36,R=10,T=10,B=26;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ind==="lhfa"?"키":"몸무게"} 성장 곡선">`;
  const step=ind==="lhfa"?(y1-y0>40?10:5):(y1-y0>15?5:(y1-y0>6?2:1));
  for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${v}</text>`;
  const xs=x1-x0>36?12:(x1-x0>12?3:1);
  for(let v=Math.ceil(x0/xs)*xs;v<=x1;v+=xs)s+=`<text x="${X(v)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink3)">${v<24?v+"m":Math.floor(v/12)+"세"+(v%12?(v%12)+"m":"")}</text>`;
  const col=["var(--coral)","var(--sun)","var(--leaf)","var(--sun)","var(--coral)"];
  lines.forEach((pts,i)=>{s+=`<polyline fill="none" stroke="${col[i]}" stroke-width="${i===2?2:1.2}" ${i===2?"":'stroke-dasharray="3 3"'} points="${pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/>`;});
  s+=`<line x1="${X(a.mf)}" x2="${X(a.mf)}" y1="${T}" y2="${H-B}" stroke="var(--ink3)" stroke-dasharray="2 3"/><text x="${X(a.mf)+4}" y="${T+10}" font-size="10" fill="var(--ink3)">오늘</text>`;
  ms.sort((p,q)=>p.x-q.x);if(ms.length>1)s+=`<polyline fill="none" stroke="var(--ink)" stroke-width="1.5" points="${ms.map(p=>X(p.x)+","+Y(p.y)).join(" ")}"/>`;
  ms.forEach(p=>{s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;});
  return s+"</svg>";
}

function vaxRing(rows,m){const due=rows.filter(r=>r.v[3]<=m+0.25);const done=due.filter(r=>r.st==="done"||r.st==="auto").length;const tot=due.length;const p=tot?done/tot:0;const C=2*Math.PI*30;

function vxRow(v,st,flu,extra){const t=ST_TAG[st];const due=flu?"10월~이듬해 4월 절기":`${monthLabel(v[3])}${v[4]-v[3]>=1?" ~ "+monthLabel(v[4]):""}`;
  return`<div class="vx"><input type="checkbox" ${RO?"disabled":""} data-vx="${v[0]}" ${st==="done"||st==="auto"?"checked":""} aria-label="${esc(v[1])} ${esc(v[2])} 완료"><div class="n">${esc(v[1])} ${esc(v[2])}<small>${due}${extra?" · "+extra:""}</small></div><span class="tag ${t[1]}">${t[0]}</span></div>`;}
function qChips(q,label,opts,multi){return`<div class="q"><div class="ql">${label}</div><div class="chips">${opts.map(o=>`<button type="button" class="chip" data-q="${q}" data-v="${o[0]}" aria-pressed="false">${o[1]}</button>`).join("")}</div></div>`;}
function syncChips(){$$(".chip[data-q]").forEach(b=>{const q=b.dataset.q,v=b.dataset.v;const on=Array.isArray(RQ[q])?RQ[q].includes(v):RQ[q]===v;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);});}

  }
  const html=`<div class="result ${level}"><h4><span aria-hidden="true">${level==="coral"?"🚨":(level==="sun"?"⚠️":"🙂")}</span> ${esc(title)}</h4>${why.map(w=>`<p style="margin:4px 0">${esc(w)}</p>`).join("")}
   ${todo.length?`<p style="margin:10px 0 2px"><b>집에서 할 일</b></p><ul class="dot">${todo.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
   <p style="margin:10px 0 2px"><b>${level==="coral"?"지금 할 일":"병원에 가야 할 신호"}</b></p><ul class="dot">${go.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
   <p class="note">증상 정보로 가능성을 정리한 참고용이에요. 진단과 약 처방은 소아청소년과 진료로 받으세요.</p></div>`;
  K.resp={html,title,level,at:new Date().toISOString(),q:JSON.parse(JSON.stringify(RQ)),why,todo,go};save();

function plateFor(m,F,ds){

  const r=seedRand((ds||ymd(new Date()))+(K.id||""));const pick=arr=>arr[Math.floor(r()*arr.length)];

  const PE={"소고기":"🥩","닭고기":"🍗","달걀노른자":"🥚","달걀":"🥚","두부":"⬜"};

function buildPage(dataJson){const raw=($("#tplSrc")||{}).textContent;if(!raw||raw.trim()===SELF_MARK)throw{code:"no_template"};const r=raw.trim();const T=b64dec(r);return T.split(SELF_MARK).join(r).split(FAM_MARK).join(dataJson);}

  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&popDay)closeDay();});
  $("#dayPop").addEventListener("click",e=>{if(e.target.id==="dayPop")closeDay();});
  $("#famBtn").onclick=openFamily;$("#exFam").onclick=()=>{closeSheets();setTimeout(openFamily,250);};
  $("#heroCardBtn").onclick=()=>{if(!K.child){openProfile("add");return;}openDay(ymd(new Date()));};
  tick();setInterval(tick,30000);
  renderHero();renderWeather();route();
  if(!FAM&&!window.claude&&/^https?:/.test(location.protocol)){fetch("family.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(f=>{if(f&&Array.isArray(f.kids)&&f.kids.length){FAM=f;loadLocal();closeSheets();renderAll();}}).catch(()=>{});}
  initCloud().finally(()=>{renderAll();}).finally(()=>{if(!K.child&&!$("#profileSheet").classList.contains("open"))openProfile("add");});
}
boot();

</script>
